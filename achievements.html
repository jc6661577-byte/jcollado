<style>
  :root {
    --bg1: #070d1f; --bg2: #0d1b44;
    --card: rgba(16, 30, 68, .92);
    --pink: #f472b6; --cyan: #7dd3fc;
    --text: #eef2ff; --muted: #a9b4d6;
  }
  html { background: #0b1636; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
  }
  .mono { font-family: "Space Mono", ui-monospace, monospace; }

  nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 32px; border-bottom: 1px solid rgba(125, 211, 252, .18);
    position: sticky; top: 0; backdrop-filter: blur(8px);
    background: rgba(7, 13, 31, .7); z-index: 5;
  }
  .logo { font-family: "Space Mono", monospace; font-size: 22px; font-weight: 700; }
  nav ul { display: flex; gap: 28px; list-style: none; }
  nav a { color: var(--text); text-decoration: none; padding-bottom: 4px; }
  nav a.active { border-bottom: 2px solid var(--pink); }

  .layout {
    display: grid; grid-template-columns: 380px 1fr; gap: 40px;
    max-width: 1300px; margin: 0 auto; padding: 60px 32px 30px; align-items: center;
  }
  .tag { color: var(--cyan); font-family: "Space Mono", monospace; margin-bottom: 8px; }
  h1 { font-size: 56px; line-height: 1.05; margin-bottom: 18px; }
  .sub { color: var(--muted); font-size: 18px; margin-bottom: 26px; }
  .btn {
    display: block; width: max-content; margin-bottom: 14px; padding: 12px 22px;
    border: 1px solid var(--pink); border-radius: 8px; color: var(--pink);
    text-decoration: none; font-family: "Space Mono", monospace;
  }
  .btn:hover { background: rgba(244, 114, 182, .12); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card); border-left: 3px solid var(--pink);
    padding: 12px 16px; border-radius: 2px;
  }
  .meta { font-family: "Space Mono", monospace; font-size: 11.5px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .card h3 { font-size: 16px; margin: 3px 0 4px; }
  .card p { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .view {
    display: inline-block; margin-top: 6px; background: none; border: 0; cursor: pointer;
    color: var(--pink); font-family: "Space Mono", monospace; font-size: 13px;
  }
  .view:hover { text-decoration: underline; }

  .gallery-wrap { max-width: 1300px; margin: 0 auto; padding: 10px 32px 60px; }
  .gallery { display: flex; gap: 14px; overflow-x: auto; padding: 8px 0 14px; }
  .gallery img {
    height: 190px; border-radius: 6px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid rgba(125, 211, 252, .35); transition: transform .15s;
  }
  .gallery img:hover { transform: translateY(-3px); }

  #lightbox {
    position: fixed; inset: 0; background: rgba(3, 6, 18, .92);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 92vh; border-radius: 8px; }
  #lightbox button {
    position: absolute; top: 16px; right: 22px; font-size: 34px; color: #fff;
    background: none; border: 0; cursor: pointer;
  }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; padding-top: 36px; }
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 42px; }
    nav { padding: 12px 18px; }
    nav ul { gap: 14px; font-size: 14px; }
  }
</style>

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="meta"></div><h3></h3><p></p>';
    card.querySelector(".meta").textContent = a.meta;
    card.querySelector("h3").textContent = a.title;
    card.querySelector("p").textContent = a.text;
    if (a.photo && PHOTOS[a.photo]) {
      const b = document.createElement("button");
      b.className = "view"; b.textContent = "View photo →";
      b.onclick = () => openBox(PHOTOS[a.photo]);
      card.appendChild(b);
    }
    grid.appendChild(card);
  });

  const gallery = document.getElementById("gallery");
  Object.values(PHOTOS).forEach(src => {
    const img = document.createElement("img");
    img.src = src; img.alt = "Certificate or medal";
    img.onclick = () => openBox(src);
    gallery.appendChild(img);
  });

  const box = document.getElementById("lightbox");
  function openBox(src) { box.querySelector("img").src = src; box.classList.add("open"); }
  box.onclick = () => box.classList.remove("open");
</script>
</body>
</html>
