<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family & Friends | Wendell James Collado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1230; --panel:#101c44; --ink:#f3f6ff; --muted:#a9b8e0; --line:#23336b;
  --teal:#f472b6; --green:#7dd3fc; --blue:#3b82f6; --violet:#ec4899;
  --sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{scroll-behavior:smooth}
.facts{scroll-margin-top:5rem}
body{background:radial-gradient(ellipse at 80% 0%,#14306b 0%,var(--bg) 55%);color:var(--ink);font:1.05rem/1.6 var(--sans);overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
a{color:inherit}
a:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
header,main{position:relative;z-index:1}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1.25rem,6vw,6rem);border-bottom:1px solid var(--line);background:rgba(10,18,48,.7);backdrop-filter:blur(6px)}
.logo{font:700 1.4rem var(--mono);text-decoration:none}
.logo span{color:var(--teal)}
.navlinks{display:flex;gap:2rem}
nav .navlinks a{text-decoration:none;padding:.3rem 0;border-bottom:2px solid transparent}
nav .navlinks a.active,nav .navlinks a:hover{border-bottom-color:var(--teal)}
.intro{min-height:calc(100vh - 4.2rem);display:grid;align-items:center;gap:3rem;padding:3rem clamp(1.25rem,6vw,6rem)}
.intro h2{margin:0 0 1rem;font:400 1.05rem var(--mono);color:var(--green)}
.intro h3{margin:0 0 1.25rem;font:700 clamp(2.2rem,6vw,3.8rem)/1.08 var(--sans);letter-spacing:-.03em}
.intro p{margin:0 0 1rem;max-width:40rem;color:var(--muted);font-size:1.2rem}
.side{display:grid;gap:1.5rem;justify-items:start}
.photo{display:block;width:min(60vw,15rem);transition:transform .2s}
.photo:hover{transform:scale(1.04)}
.ring{padding:6px;border-radius:50%;background:linear-gradient(140deg,var(--green),var(--blue) 60%,var(--violet));box-shadow:0 0 50px rgba(59,130,246,.25)}
.ring div{border-radius:50%;background:#fff;aspect-ratio:1;overflow:hidden;border:6px solid var(--bg)}
.ring img{width:100%;height:100%;object-fit:Back to Home;object-position:center top;display:block}
.facts{display:grid;gap:1rem;width:100%}
.fact{padding:.9rem 1.2rem;border-left:3px solid var(--teal);background:var(--panel)}
.fact small{display:block;font:400 .78rem var(--mono);letter-spacing:.12em;color:var(--muted)}
.back{display:inline-block;margin-top:1.25rem;padding:.8rem 1.4rem;border:1px solid var(--teal);border-radius:.4rem;color:var(--teal);font:700 1rem var(--mono);text-decoration:none}
.back:hover{background:var(--teal);color:var(--bg)}
.buttons{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.25rem}
.buttons .back{margin-top:0}
@media(min-width:62rem){.intro{grid-template-columns:1.3fr 1fr}}
@media(max-width:40rem){.navlinks{gap:1rem}}
/* never scrolls: everything is sized to the screen on every device */
html,body{height:100%}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:clamp(.7rem,1.9vh,1.05rem);line-height:1.4}
header{flex:none}
nav{padding-block:clamp(.4rem,1.4vh,1rem)}
.logo{font-size:clamp(1rem,2.6vh,1.4rem)}
.navlinks{gap:clamp(.8rem,3vw,2rem)}
main{flex:1;min-height:0}
.intro{min-height:0;height:100%;align-content:center;gap:clamp(.5rem,2vh,3rem);padding:clamp(.5rem,2vh,2rem) clamp(1rem,6vw,6rem)}
.intro h2{margin-bottom:.3rem;font-size:clamp(.75rem,1.9vh,1.05rem)}
.intro h3{font-size:clamp(1.6rem,min(6vh,9vw),3.8rem);margin-bottom:clamp(.3rem,1.5vh,1.25rem)}
.intro p{font-size:clamp(.72rem,min(2vh,3.4vw),1.2rem);margin-bottom:.5rem}
.buttons{margin-top:clamp(.4rem,1.5vh,1.25rem)}
.back{padding:clamp(.4rem,1.2vh,.8rem) clamp(.8rem,2vw,1.4rem);font-size:clamp(.72rem,1.8vh,1rem)}
.side{gap:clamp(.4rem,1.6vh,1.5rem)}
.photo{width:clamp(3.5rem,11vh,11rem)}
.ring{padding:4px}
.ring div{border-width:4px}
.facts{grid-template-columns:repeat(2,1fr);gap:clamp(.3rem,1vh,.8rem)}
.fact{padding:clamp(.25rem,.9vh,.7rem) clamp(.5rem,1.5vw,1rem);overflow-wrap:anywhere;font-size:clamp(.7rem,1.8vh,1rem);line-height:1.25}
.fact small{font-size:clamp(.55rem,1.3vh,.78rem)}
@media(min-width:62rem),(orientation:landscape) and (min-width:35rem){
  .intro{grid-template-columns:1fr 1.15fr;gap:clamp(1rem,4vw,3rem)}
  .intro h3{font-size:clamp(1.6rem,6.5vh,3.8rem)}
  .intro p{font-size:clamp(.72rem,2.2vh,1.2rem)}
  .photo{width:clamp(3.5rem,22vh,11rem)}
  .fact{font-size:clamp(.7rem,1.9vh,1rem)}
}
/* phones (portrait) */
@media(max-width:62rem) and (orientation:portrait){
  .intro p{font-size:clamp(.68rem,min(1.9vh,3.2vw),1.1rem);line-height:1.35;margin-bottom:.4rem}
  .fact{font-size:clamp(.62rem,min(1.6vh,3.1vw),1rem);line-height:1.2}
  .fact small{font-size:clamp(.5rem,1.1vh,.7rem)}
  .facts{gap:.3rem}
}
@media(max-width:62rem) and (orientation:portrait) and (max-height:720px){
  .photo{display:none}
}
@media(max-width:62rem) and (orientation:portrait) and (max-height:600px){
  .intro p + p{display:none}
}
@media(max-height:420px){.photo{display:none}}
.facts.one{grid-template-columns:1fr !important}
.fact strong{display:block;font-weight:700;color:var(--ink)}
.fact span{display:block;color:var(--muted);font-size:.92em}
@media(max-width:40rem){nav{flex-wrap:wrap;gap:.3rem}.navlinks{gap:.8rem;flex-wrap:wrap;font-size:.85rem}}
/* achievements page: scrolls on phones, fits on one screen on computers */
html,body{height:auto}
body{height:auto;min-height:100dvh;display:block;overflow-x:hidden;overflow-y:auto;font-size:clamp(.8rem,1.9vh,1.05rem)}
main{min-height:0}
.intro{height:auto;min-height:0;align-items:start;padding-block:clamp(1.5rem,5vh,3rem)}
.fact{padding:.7rem 1rem;font-size:inherit}
.fact small{font-size:.7rem}
.gallery{padding:1rem clamp(1rem,6vw,6rem) 3rem}
.gallery h2{margin:0 0 .8rem;font:400 1.05rem var(--mono);color:var(--green)}
.gallery .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:1rem}
.gallery figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;overflow:hidden}
.gallery img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in;transition:transform .2s}
.gallery img:hover{transform:scale(1.04)}
.gallery figcaption{padding:.4rem .6rem;font:400 .7rem var(--mono);color:var(--muted)}
#lb{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(4,8,24,.92);cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:84vh;border-radius:.5rem}
#lb{flex-direction:column;gap:.8rem}
#lb .cap{color:var(--ink);font:700 1rem var(--sans)}
#lb .backbtn{padding:.5rem 1.2rem;border:1px solid var(--teal);border-radius:.4rem;color:var(--teal);font:700 .95rem var(--mono);background:transparent;cursor:pointer}
#lb .backbtn:hover{background:var(--teal);color:var(--bg)}
.fact[data-img]{cursor:pointer;transition:background .15s}
.fact[data-img]:hover,.fact[data-img]:focus-visible{background:#172a5c;outline:none}
.fact[data-img]::after{content:"View photo \2192";display:block;margin-top:.15rem;font:400 .68rem var(--mono);color:var(--teal)}
@media(min-width:62rem) and (min-height:560px){
  html,body{height:100%}
  body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:clamp(.62rem,1.55vh,.95rem);line-height:1.3}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  .intro{flex:1;min-height:0;grid-template-columns:.8fr 2.2fr;align-items:center;gap:clamp(1rem,3vw,2.5rem);padding:clamp(.4rem,1.5vh,1.2rem) clamp(1rem,5vw,5rem) 0}
  .intro h3{font-size:clamp(1.5rem,5vh,3.2rem)}
  .intro p{font-size:clamp(.7rem,1.8vh,1.05rem)}
  .facts.one{grid-template-columns:repeat(2,1fr) !important;gap:clamp(.25rem,.9vh,.6rem)}
  .fact{padding:clamp(.25rem,.8vh,.5rem) clamp(.5rem,1vw,.8rem)}
  .fact small{font-size:clamp(.5rem,1.15vh,.65rem);letter-spacing:.08em}
  .fact span{font-size:.9em;line-height:1.25}
  .gallery{flex:none;padding:clamp(.3rem,1vh,.8rem) clamp(1rem,5vw,5rem) clamp(.5rem,1.5vh,1rem)}
  .gallery h2{margin:0 0 .4rem;font-size:clamp(.65rem,1.5vh,.95rem)}
  .gallery .grid{grid-template-columns:repeat(8,1fr);gap:clamp(.4rem,1vw,.8rem)}
  .gallery img{aspect-ratio:auto;height:clamp(4rem,19vh,12rem);object-position:center top}
  .gallery figcaption{display:none}
}

/* family & friends page */
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;width:100%}
.pcard{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;overflow:hidden;display:flex;flex-direction:column}
.pcard .ph{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,#101c44,#172a5c);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font:400 .8rem var(--mono)}
.pcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;cursor:zoom-in;transition:transform .2s}
.pcard .ph img:hover{transform:scale(1.03)}
.pcard .ph .ph-text{display:none;padding:1rem}
.pcard .ph.empty{border-bottom:1px dashed var(--line)}
.pcard .ph.empty .ph-text{display:block}
.pcard .ph .ph-text b{display:block;color:var(--teal);font-size:1.4em;margin-bottom:.3rem}
.pcard figcaption{padding:.6rem .9rem;border-top:3px solid var(--teal)}
.pcard figcaption small{display:block;font:400 .7rem var(--mono);letter-spacing:.12em;color:var(--muted)}
.pcard figcaption strong{display:block;font-weight:700;color:var(--ink)}
@media(min-width:62rem) and (min-height:560px){
  .intro{grid-template-columns:.8fr 2.2fr}
  .people{grid-template-columns:repeat(4,1fr);gap:clamp(.5rem,1.2vw,1rem)}
  .pcard .ph{aspect-ratio:auto;height:clamp(10rem,56vh,34rem)}
  .pcard figcaption{padding:.5rem .8rem}
}

/* photos: scrollable page, friends photo wide */
@media(min-width:62rem) and (min-height:560px){
  html,body{height:auto}
  body{height:auto;min-height:100dvh;display:block;overflow-x:hidden;overflow-y:auto}
  main{display:block}
  .intro{grid-template-columns:.8fr 2.2fr;align-items:start;padding:clamp(1.5rem,5vh,3rem) clamp(1rem,5vw,5rem) 3rem}
  .intro > div:first-child{position:sticky;top:1.5rem;align-self:start;padding-top:12vh}
  .people{grid-template-columns:repeat(3,1fr)}
  .pcard .ph{height:auto;aspect-ratio:3/4}
}
.pcard.wide{grid-column:1/-1}
.pcard.wide .ph{aspect-ratio:1.25;height:auto}
.pcard .ph img{object-position:center 30%}

/* ===== family & friends: NEVER scrolls — everything is sized to the screen ===== */
html,body{height:100% !important;overflow:hidden !important}
body{height:100dvh !important;min-height:0 !important;display:flex !important;flex-direction:column !important;overflow:hidden !important;font-size:clamp(.7rem,1.9vh,1.05rem) !important;line-height:1.35}
header{flex:none}
main{flex:1 1 auto !important;min-height:0 !important;display:flex !important;flex-direction:column !important}
.intro{flex:1 1 auto !important;min-height:0 !important;height:100% !important;display:flex !important;flex-direction:column !important;align-items:stretch !important;align-content:normal !important;gap:clamp(.4rem,1.6vh,1.5rem) !important;padding:clamp(.4rem,1.6vh,1.5rem) clamp(.8rem,5vw,5rem) !important}
.intro > div:first-child{position:static !important;padding-top:0 !important;flex:none}
.intro h2{margin:0 0 .15rem !important;font-size:clamp(.65rem,1.6vh,1rem) !important}
.intro h3{margin:0 0 .25rem !important;font-size:clamp(1.3rem,min(5vh,8vw),3rem) !important}
.intro p{margin:0 0 .3rem !important;font-size:clamp(.68rem,1.8vh,1.05rem) !important}
.buttons{margin-top:.4rem !important;gap:.5rem !important}
.back{padding:clamp(.3rem,.9vh,.6rem) clamp(.7rem,1.8vw,1.2rem) !important;font-size:clamp(.65rem,1.6vh,.95rem) !important}
.side{flex:1 1 auto !important;min-height:0 !important;display:block !important;width:100%}
.people{height:100% !important;width:100% !important;display:grid !important;gap:clamp(.3rem,1vh,.9rem) !important;
  grid-template-columns:repeat(6,minmax(0,1fr)) !important;grid-template-rows:repeat(2,minmax(0,1fr)) !important}
.pcard{min-height:0 !important;min-width:0 !important;grid-column:span 3 !important;display:flex !important;flex-direction:column !important}
.pcard:nth-child(3){grid-column:span 2 !important}
.pcard.wide{grid-column:span 4 !important}
.pcard .ph,.pcard.wide .ph{flex:1 1 0 !important;min-height:0 !important;height:auto !important;aspect-ratio:auto !important}
.pcard .ph img{object-fit:cover;object-position:center 30%}
.pcard.wide .ph img{object-position:center 35%}
.pcard figcaption{flex:none;padding:clamp(.2rem,.7vh,.5rem) .6rem !important;border-top-width:2px}
.pcard figcaption small{font-size:clamp(.5rem,1.1vh,.7rem) !important}
.pcard figcaption strong{font-size:clamp(.65rem,1.6vh,1rem);line-height:1.2}
.pcard figcaption{min-height:clamp(2.6rem,7.4vh,3.9rem);display:flex;flex-direction:column;justify-content:center}
.pcard:nth-child(1) .ph img{object-position:center 45% !important}
.pcard:nth-child(2) .ph img{object-position:center 0% !important}
.pcard:nth-child(3) .ph img{object-position:center 25% !important}
/* wide screens / landscape: text on the left, one row of photos on the right */
@media(min-width:62rem),(orientation:landscape) and (min-width:35rem){
  .intro{flex-direction:row !important;align-items:stretch !important;gap:clamp(1rem,3vw,3rem) !important}
  .intro > div:first-child{flex:0 0 clamp(11rem,26vw,22rem);align-self:center}
  .side{flex:1 1 0 !important;height:100%}
}
/* very short screens: drop the small heading + blurb so photos keep room */
@media(max-height:430px){.intro h2,.intro p{display:none !important}.intro h3{font-size:clamp(1.1rem,6vh,1.6rem) !important}}
</style>

<script>
(function(){


  var c = document.getElementById("net"), x = c.getContext("2d"), pts = [], W, H;
  function size(){
    W = c.width = innerWidth; H = c.height = innerHeight;
    var n = Math.min(70, Math.floor(W * H / 20000));
    pts = [];
    for (var j = 0; j < n; j++) pts.push({x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-.5)*.25, vy: (Math.random()-.5)*.25});
  }
  function draw(){
    x.clearRect(0, 0, W, H);
    for (var a = 0; a < pts.length; a++){
      var p = pts[a];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      for (var b = a + 1; b < pts.length; b++){
        var q = pts[b], d = Math.hypot(p.x - q.x, p.y - q.y);
        if (d < 150){ x.strokeStyle = "rgba(244,114,182," + (0.18 * (1 - d/150)) + ")"; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke(); }
      }
      x.fillStyle = "rgba(244,114,182,.7)"; x.beginPath(); x.arc(p.x, p.y, 2, 0, 6.283); x.fill();
    }
    requestAnimationFrame(draw);
  }
  size(); draw();
  addEventListener("resize", size);
})();
</script>
